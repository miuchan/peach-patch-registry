[package]
name = "peach-cli"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "Peach Patch registry CLI"
license = "MIT"
default-run = "peach"

[[bin]]
name = "peach"
path = "src/bin/peach.rs"

[[bin]]
name = "peach-registry"
path = "src/bin/peach-registry.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
url = "2"
wait-timeout = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wasmi = { version = "0.51", features = ["simd"] }
