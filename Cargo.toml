[package]
name = "peach-cli"
version = "1.0.0"
edition = "2021"
description = "Peach Patch registry CLI"
license = "MIT"

[[bin]]
name = "peach"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
